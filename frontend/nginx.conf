server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;
  # Same headers the Netlify site sent (the app is now also served directly from here).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Look up the api container on every request (Docker DNS), so a restarted api with a new address is found.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
