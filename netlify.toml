# Netlify hosts the web pages only. The API, database and agents run on the M2 behind a Tailscale Funnel.
# Netlify relays /api/* to it, so the browser only ever talks to the Netlify site (no cross-site calls).
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE = ""

[[redirects]]
  from = "/api/*"
  to = "https://jimmy-macbook-pro-m2-personal.tailb8354c.ts.net/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
